<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 96">
  <!-- Labels above arrows -->
  <text x="185" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">POST /send</text>
  <text x="365" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">PRIVMSG</text>

  <!-- HTTP client -->
  <rect x="10" y="28" width="130" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="75" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">HTTP client</text>

  <!-- Arrow 1 -->
  <line x1="141" y1="50" x2="222" y2="50" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="222,46 230,50 222,54" fill="#58a6ff"/>

  <!-- msg2irc -->
  <rect x="230" y="28" width="100" height="44" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1.5"/>
  <text x="280" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">msg2irc</text>

  <!-- Arrow 2 -->
  <line x1="331" y1="50" x2="392" y2="50" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="392,46 400,50 392,54" fill="#58a6ff"/>

  <!-- IRC server -->
  <rect x="400" y="28" width="130" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="465" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">IRC server</text>

  <!-- Arrow 3 -->
  <line x1="531" y1="50" x2="592" y2="50" stroke="#58a6ff" stroke-width="1.5"/>
  <polygon points="592,46 600,50 592,54" fill="#58a6ff"/>

  <!-- #channel / nick -->
  <rect x="600" y="28" width="185" height="44" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="692" y="54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">#channel / nick</text>
</svg>
